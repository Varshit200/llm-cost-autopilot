version: '3.8'

services:
  api:
    build: .
    container_name: autopilot-api
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./config:/app/config
    environment:
      - LLM_PROVIDER_MODE=auto
      - HOST=0.0.0.0
      - PORT=8000
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  dashboard:
    build: .
    container_name: autopilot-dashboard
    restart: always
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./config:/app/config
    environment:
      - LLM_PROVIDER_MODE=auto
    command: ["streamlit", "run", "dashboard/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    depends_on:
      - api
